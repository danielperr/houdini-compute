{% load static %}<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>{% block title %}Houdini Compute{% endblock %}</title>
  <link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 16 16'><rect width='16' height='16' rx='3' fill='%232a78d6'/></svg>">
  <link rel="stylesheet" href="{% static 'compute/app.css' %}">
  <script src="{% static 'vendor/htmx.min.js' %}" defer></script>
  <script src="{% static 'vendor/echarts.min.js' %}" defer></script>
  <script src="{% static 'compute/charts.js' %}" defer></script>
</head>
<body>
  <header class="topbar">
    <a class="brand" href="{% url 'overview' %}">Houdini Compute</a>
    <nav>
      <a href="{% url 'overview' %}" class="{% if request.resolver_match.url_name == 'overview' %}active{% endif %}">Overview</a>
      <a href="{% url 'admin:index' %}">Admin</a>
    </nav>
  </header>
  <main>{% block content %}{% endblock %}</main>
</body>
</html>
